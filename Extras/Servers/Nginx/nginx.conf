# Socket.io (Add this to the first (443) server, above location / {})
location /socket.io/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 86400s;
}

# Security
location ^~ /content/uploads/ {
  location ~* \.(php|php\d*|phtml|phps|pht|phar|cgi|pl|py|rb|asp|aspx|jsp|sh|bash|exe|js|html?)$ {
    deny all;
    return 403;
  }
  location ~* "\.[^./]+\.[^./]+$" {
    deny all;
    return 403;
  }
  try_files $uri =404;
}
location ^~ /content/backups/ {
  deny all;
  return 403;
}
location ^~ /content/cache/ {
  deny all;
  return 403;
}
location ~ ^/content/themes/[^/]+/src/ {
  deny all;
  return 403;
}
location ~ /\.(ht|svn|git) {
  deny all;
}
location ~* \.(htpasswd|ini|log|sh|inc|bak|tpl)$ {
  deny all;
  return 403;
}
location ~ /(composer\.json|composer\.lock|package\.json|package-lock\.json|vite\.config\.m?js)$ {
  deny all;
  return 403;
}

